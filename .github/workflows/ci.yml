name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tests import other apps' built output, so build comes first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: The agent page reaches the MCP server
        run: curl -sf http://127.0.0.1:4000/api/status | grep '"state":"connected"'
      - name: Logs
        if: always()
        run: docker compose logs
